[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "peekaboo"
version = "0.1.0"
description = "Graph-based OSINT investigation toolkit — with Red2 campaign bridge"
authors = [{name = "HarpStar"}]
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "Flask>=2.3",
    "networkx>=3.0",
    "pyvis>=0.3",
    "requests>=2.28",
    "beautifulsoup4>=4.11",
    "python-whois>=0.8",
    "dnspython>=2.4",
]

[project.scripts]
peekaboo = "peekaboo.cli:main"

[tool.setuptools.packages.find]
include = ["peekaboo*"]

[tool.setuptools.package-data]
peekaboo = ["py.typed"]